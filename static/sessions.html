<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>debt-radar — 세션 상세</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;}
  :root, [data-theme="dark"]{
    --bg:#262624; --panel:#30302e; --panel-2:#383734; --hover:#3f3e3b;
    --border:#413f3b; --border-2:#54524d; --text:#f3efe7; --text-2:#c3bcae; --muted:#8b857a;
    --grid:#37352f; --accent:#d97757; --accent-2:#c15f3c;
    --danger:#e5735a; --danger-bg:rgba(229,115,90,.14); --warn:#d9a441; --warn-bg:rgba(217,164,65,.13);
    --ok:#8aa56f; --ok-bg:rgba(138,165,111,.14); --info:#d97757;
  }
  [data-theme="light"]{
    --bg:#f5f1eb; --panel:#faf9f5; --panel-2:#efe9df; --hover:#e9e2d6;
    --border:#e3dccf; --border-2:#d4cbba; --text:#2b2a27; --text-2:#5c574d; --muted:#918a7c;
    --grid:#e8e1d5; --accent:#cc785c; --accent-2:#b5623f;
    --danger:#c6493b; --danger-bg:rgba(198,73,59,.10); --warn:#b5822a; --warn-bg:rgba(181,130,42,.13);
    --ok:#5e8c5a; --ok-bg:rgba(94,140,90,.12); --info:#cc785c;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  ::-webkit-scrollbar{height:9px;width:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}
  .hidden{display:none !important;}
  .btn{display:inline-grid;place-items:center;height:30px;min-width:30px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text-2);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;transition:background .15s,color .15s;}
  .btn:hover{background:var(--hover);color:var(--text);}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;}
  .badge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:1px 6px;border-radius:5px;display:inline-block;border:1px solid var(--border-2);color:var(--text-2);}
  .turn{border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:grid;gap:10px;}
  .turn-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.4px;}
  .excerpt{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.55;}
  details summary{cursor:pointer;font-size:12.5px;color:var(--text-2);}
  .diff-line{white-space:pre;font-size:12px;line-height:1.5;padding:0 10px;}
  .diff-add{background:var(--ok-bg);color:var(--text);}
  .diff-del{background:var(--danger-bg);color:var(--text);}
  .diff-ctx{color:var(--text-2);}
  .diff-hunk-header{font-size:11px;color:var(--muted);padding:6px 10px;background:var(--panel-2);}
  .file-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 14px;cursor:pointer;font-size:13px;}
  .file-row:hover{background:var(--hover);}
</style>
</head>
<body>
<div id="app" data-theme="dark" style="min-height:100vh;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:26px 26px;">
  <div style="max-width:1240px;margin:0 auto;padding:clamp(14px,3vw,30px);">

    <header style="display:flex;flex-wrap:wrap;align-items:center;gap:16px 20px;padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid var(--border);">
      <div style="display:flex;align-items:center;gap:13px;margin-right:auto;">
        <div style="width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-weight:600;color:#fff;font-size:17px;">☰</div>
        <div>
          <div class="display" style="font-weight:700;font-size:19px;letter-spacing:-.3px;line-height:1.1;">debt-radar</div>
          <div class="mono" style="font-size:12px;color:var(--muted);letter-spacing:.2px;">세션 상세 · 세션별 변경 검토</div>
        </div>
      </div>
      <a href="/" class="btn" style="text-decoration:none;display:inline-flex;align-items:center;height:36px;padding:0 13px;">← 사용량 대시보드</a>
      <a href="/static/progress.html" class="btn" style="text-decoration:none;display:inline-flex;align-items:center;height:36px;padding:0 13px;">진행내역 →</a>
      <button id="btn-theme" class="btn" style="height:36px;padding:0 13px;">☾ Dark</button>
    </header>

    <!-- 오류·로딩 표시는 상세 뷰가 자기 컨테이너 안에 직접 그린다 (loadDetail).
         목록 폐기와 함께 status-line·error-state 전역 슬롯은 제거했다. -->
    <div id="list-view" style="display:grid;gap:18px;"></div>
    <div id="detail-view" class="hidden" style="display:grid;gap:14px;"></div>

    <footer style="text-align:center;color:var(--muted);font-size:11.5px;font-family:'IBM Plex Mono',monospace;padding:20px 0 4px;">
      로컬 대시보드 · GET /api/work/session/{source}/{id}
    </footer>
  </div>
</div>
<script src="/static/sessions_diff.js"></script>
<script src="/static/sessions.js"></script>
</body>
</html>
